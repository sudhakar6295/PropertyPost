{% extends "base.html" %}
{% block title %}Sign in | PropertyPost{% endblock %}
{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-12 col-md-7 col-lg-5">
<div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><h1 class="h3 mb-2">Welcome back</h1><p class="text-secondary">Sign in to manage your plot adverts.</p>
{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" autocomplete="username" required></div>
<div class="mb-4"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div>
<button class="btn btn-primary w-100" type="submit">Sign in</button></form></div></div></div></div></div>
{% endblock %}
