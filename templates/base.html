{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PropertyPost — find your next property.">
    <title>{% block title %}PropertyPost{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
    <link href="{% static 'css/site.css' %}" rel="stylesheet">
  </head>
  <body class="bg-body-tertiary d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark" aria-label="Primary navigation">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">PropertyPost</a>
        {% if user.is_authenticated %}<div class="d-flex gap-2 align-items-center">
          <a class="btn btn-outline-light btn-sm" href="{% url 'dashboard' %}">My plots</a>
          <form method="post" action="{% url 'broker-logout' %}">{% csrf_token %}<button class="btn btn-light btn-sm">Sign out</button></form>
        </div>{% endif %}
      </div>
    </nav>
    <main class="flex-grow-1">{% block content %}{% endblock %}</main>
    <footer class="border-top bg-white py-4">
      <div class="container text-secondary small">PropertyPost</div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
