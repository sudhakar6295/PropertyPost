[project]
name = "propertypost"
version = "0.1.0"
description = "A privacy-conscious property listing platform built with Django."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "firebase-admin>=7.8.0",
    "google-cloud-storage>=3.6,<4",
    "gunicorn>=23,<24",
    "pillow>=13.0.0",
    "pymysql>=1.1,<2",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "propertypost.settings.development"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
quote-style = "double"
